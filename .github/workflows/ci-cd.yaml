
name: Docker Build and Manifest Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/deployment.yaml

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-update:
    name: Build Docker Image and Update Manifest
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Generate lowercase image name
      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 5. Update Kubernetes deployment manifest
      - name: Update deployment.yaml
        if: github.event_name == 'push'
        run: |
          if ! grep -qE '^[[:space:]]*image:' k8s/deployment.yaml; then
            echo "ERROR: No image field found in k8s/deployment.yaml"
            exit 1
          fi

          sed -i -E "s|(^[[:space:]]*image:).*|\1 ${IMAGE_NAME}:${IMAGE_TAG}|" k8s/deployment.yaml

          echo "Updated k8s/deployment.yaml:"
          cat k8s/deployment.yaml

      # 6. Commit and push updated manifest
      - name: Commit and Push Updated Manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update deployment image to ${IMAGE_TAG}"
            git push origin HEAD:main
          else
            echo "No changes to deployment.yaml"
          fi
