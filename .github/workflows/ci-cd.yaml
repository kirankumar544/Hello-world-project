
name: Docker Build and Manifest Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - deployment.yaml

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-update:
    name: Build Docker Image and Update Manifest
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Generate lowercase image name and tag
      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # Step 3: Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Step 5: Update deployment.yaml image tag
      - name: Update deployment.yaml
        if: github.event_name == 'push'
        run: |
          sed -i "s|image:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" deployment.yaml

          echo "Updated deployment.yaml:"
          cat deployment.yaml

      # Step 6: Commit updated deployment.yaml
      - name: Commit and Push Updated Manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update deployment image to ${IMAGE_TAG}"
            git push
          else
            echo "No changes to deployment.yaml"
          fi
