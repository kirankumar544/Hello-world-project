
name: Hello World CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # JOB 1: Build and Push Docker Image
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # JOB 2: Deploy to Kubernetes KIND
  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, x64, kind]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Kubernetes Cluster
        run: kubectl cluster-info

      - name: Apply Kubernetes Service
        run: kubectl apply -f service.yaml

      - name: Apply Kubernetes Deployment
        run: kubectl apply -f deployment.yaml

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/hello-world \
            hello-world=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/hello-world \
            --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
