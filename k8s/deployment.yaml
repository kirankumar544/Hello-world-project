
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: ghcr.io/kirankumar544/hello-world-project:bfdfa99b4ba9bdf9f1123eeaa1428d12c6b805b2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
