
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: ghcr.io/kirankumar544/hello-world-project:8fc125656a3792061456384bcc488a25524b70f5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
