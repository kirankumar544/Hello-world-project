
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: ghcr.io/kirankumar544/hello-world-project:e30452fb39d4a268c7b4d533cf85dd3bc28fa91c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
